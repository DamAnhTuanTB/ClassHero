<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M7 Student Learning Design</title>
    <style>
      :root {
        --ink: #17243c;
        --muted: #66758c;
        --line: #dbe8f3;
        --sky: #1688f8;
        --sky-2: #066fe5;
        --sky-soft: #eaf6ff;
        --green: #16a46b;
        --green-soft: #e9fbf3;
        --amber: #f59e0b;
        --amber-soft: #fff7df;
        --red: #ef4a5c;
        --red-soft: #fff0f2;
        --violet: #7658ef;
        --violet-soft: #f1efff;
        --surface: #ffffff;
        --bg: #e5f5ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 390px;
        min-height: 844px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", Arial, sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background:
          radial-gradient(circle at 90% 4%, rgba(42, 169, 255, 0.14), transparent 23%),
          linear-gradient(180deg, #f4fbff 0, #e5f5ff 38%, #f7fbff 100%);
      }

      .appbar {
        position: absolute;
        z-index: 20;
        inset: 0 0 auto;
        height: 66px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.97);
        border-bottom: 1px solid #dcebf5;
      }

      .back,
      .icon-button {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: #f2f8fd;
        color: #29415f;
        font-weight: 900;
        font-size: 23px;
      }

      .back {
        margin-left: -5px;
        background: transparent;
        font-size: 29px;
      }

      .brand {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .brand img {
        width: 146px;
        height: 42px;
        object-fit: contain;
        object-position: left center;
      }

      .app-actions {
        display: flex;
        gap: 5px;
      }

      .app-actions .icon-button {
        width: 38px;
        height: 38px;
        background: transparent;
        font-size: 20px;
      }

      .main {
        position: absolute;
        inset: 66px 0 68px;
        overflow: hidden;
        padding: 13px 14px 20px;
      }

      .bottom-nav {
        position: absolute;
        z-index: 30;
        inset: auto 0 0;
        height: 68px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid #d9e7f2;
        box-shadow: 0 -9px 24px rgba(31, 77, 116, 0.08);
      }

      .nav-item {
        position: relative;
        display: grid;
        place-content: center;
        gap: 2px;
        color: #718096;
        text-align: center;
        font-size: 9px;
        font-weight: 800;
      }

      .nav-item .nav-icon {
        font-size: 21px;
        line-height: 1;
        filter: grayscale(1);
      }

      .nav-item.active {
        color: var(--sky-2);
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        inset: 0 7px auto;
        height: 3px;
        border-radius: 0 0 4px 4px;
        background: var(--sky);
      }

      .nav-item.active .nav-icon {
        filter: none;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        line-height: 1.22;
        font-weight: 900;
      }

      h2 {
        font-size: 17px;
        line-height: 1.3;
        font-weight: 900;
      }

      h3 {
        font-size: 15px;
        line-height: 1.3;
        font-weight: 850;
      }

      .eyebrow {
        color: #61758e;
        font-size: 11px;
        font-weight: 800;
      }

      .sub {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        font-weight: 600;
      }

      .card {
        border: 1px solid rgba(200, 221, 236, 0.94);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
      }

      .pad {
        padding: 14px;
      }

      .stack {
        display: grid;
        gap: 11px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .between {
        justify-content: space-between;
      }

      .grow {
        flex: 1;
        min-width: 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--sky-soft);
        color: #0871d5;
        font-size: 10px;
        line-height: 1;
        font-weight: 900;
        white-space: nowrap;
      }

      .badge.green {
        background: var(--green-soft);
        color: #098155;
      }

      .badge.amber {
        background: var(--amber-soft);
        color: #b96c00;
      }

      .badge.red {
        background: var(--red-soft);
        color: #c62e40;
      }

      .badge.violet {
        background: var(--violet-soft);
        color: #6245d8;
      }

      .button {
        min-height: 44px;
        border: 0;
        border-radius: 13px;
        padding: 0 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: white;
        background: linear-gradient(180deg, #2499ff, #0877e9);
        box-shadow: 0 7px 14px rgba(18, 126, 230, 0.2);
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .button.secondary {
        color: #126fca;
        background: white;
        border: 1px solid #b8dcfa;
        box-shadow: none;
      }

      .button.green {
        background: linear-gradient(180deg, #28ba7c, #12925f);
        box-shadow: 0 7px 14px rgba(16, 153, 96, 0.18);
      }

      .button.red {
        background: linear-gradient(180deg, #ff6472, #e94254);
        box-shadow: 0 7px 14px rgba(229, 62, 81, 0.18);
      }

      .button.disabled {
        background: #cbd7e3;
        color: #738297;
        box-shadow: none;
      }

      .button.full {
        width: 100%;
      }

      .breadcrumb {
        display: flex;
        gap: 5px;
        align-items: center;
        min-width: 0;
        color: #56708a;
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
      }

      .breadcrumb span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .lesson-heading {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .video {
        position: relative;
        height: 183px;
        overflow: hidden;
        border-radius: 18px;
        background:
          radial-gradient(circle at 78% 26%, rgba(255, 255, 255, 0.23), transparent 22%),
          linear-gradient(145deg, #0b62d8, #159eea 58%, #63d1ff);
        color: white;
      }

      .video::before {
        content: "a/b   ×   √x    ∑    x²";
        position: absolute;
        top: 23px;
        left: 20px;
        font-family: Georgia, serif;
        font-size: 23px;
        letter-spacing: 4px;
        opacity: 0.85;
      }

      .video::after {
        content: "TỈ LỆ THỨC";
        position: absolute;
        right: 20px;
        bottom: 22px;
        font-size: 19px;
        font-weight: 950;
        letter-spacing: 1px;
      }

      .play {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.95);
        color: var(--sky-2);
        font-size: 25px;
        padding-left: 4px;
        box-shadow: 0 14px 30px rgba(9, 66, 142, 0.24);
      }

      .video-time {
        position: absolute;
        left: 12px;
        bottom: 10px;
        padding: 4px 8px;
        border-radius: 7px;
        background: rgba(7, 39, 77, 0.66);
        font-size: 10px;
        font-weight: 800;
      }

      .progress {
        height: 8px;
        border-radius: 99px;
        background: #e3ebf2;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0d7ce9, #35b8ff);
      }

      .lesson-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .lesson-tab {
        min-width: 0;
        padding: 9px 4px;
        border: 1px solid #d7e6f1;
        border-radius: 11px;
        background: white;
        color: #607187;
        text-align: center;
        font-size: 10px;
        font-weight: 900;
      }

      .lesson-tab.active {
        border-color: #8dc9fa;
        background: var(--sky-soft);
        color: #0772d5;
      }

      .mini-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 10px 11px;
        border-radius: 13px;
        background: #f7fbfe;
        border: 1px solid #e2edf5;
      }

      .mini-icon,
      .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: #e7f4ff;
        font-size: 18px;
      }

      .avatar {
        border-radius: 50%;
        color: white;
        background: linear-gradient(135deg, #3d9bf3, #6d64e8);
        font-size: 12px;
        font-weight: 900;
      }

      .paywall {
        margin-top: 46px;
        padding: 24px 18px;
        text-align: center;
      }

      .paywall-icon {
        width: 78px;
        height: 78px;
        margin: 0 auto 14px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e8f5ff, #fff);
        border: 1px solid #cae6fa;
        font-size: 36px;
      }

      .question-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .step-circle {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #0871d5;
        background: var(--sky-soft);
        font-size: 13px;
        font-weight: 950;
      }

      .answer-list {
        display: grid;
        gap: 9px;
      }

      .answer {
        min-height: 51px;
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 10px;
        align-items: center;
        padding: 9px 11px;
        border-radius: 13px;
        border: 1px solid #dbe7f0;
        background: white;
        color: #32445b;
        font-size: 13px;
        line-height: 1.35;
        font-weight: 750;
      }

      .answer .letter {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #f0f5f9;
        color: #5e7087;
        font-size: 11px;
        font-weight: 950;
      }

      .answer.selected {
        border-color: #68b9f8;
        background: #eef8ff;
        color: #086cc9;
      }

      .answer.selected .letter {
        color: white;
        background: var(--sky);
      }

      .answer.correct {
        border-color: #6ed6aa;
        background: var(--green-soft);
        color: #087a52;
      }

      .answer.correct .letter {
        color: white;
        background: var(--green);
      }

      .answer.wrong {
        border-color: #ff9da8;
        background: var(--red-soft);
        color: #b82a3d;
      }

      .answer.wrong .letter {
        color: white;
        background: var(--red);
      }

      .question-dots {
        display: flex;
        gap: 6px;
        justify-content: center;
      }

      .question-dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c8d6e2;
      }

      .question-dots span.done {
        background: var(--green);
      }

      .question-dots span.active {
        width: 22px;
        border-radius: 99px;
        background: var(--sky);
      }

      .score-ring {
        width: 94px;
        height: 94px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--green) 0 80%, #e5edf3 80%);
        margin: 0 auto;
      }

      .score-ring > div {
        width: 73px;
        height: 73px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: white;
        text-align: center;
      }

      .score-ring strong {
        display: block;
        color: var(--green);
        font-size: 25px;
        line-height: 1;
      }

      .score-ring small {
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .result-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 10px 5px;
        border-radius: 12px;
        text-align: center;
        background: #f4f9fd;
      }

      .stat strong {
        display: block;
        color: #23374f;
        font-size: 17px;
        font-weight: 950;
      }

      .stat small {
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
      }

      .flashcard {
        position: relative;
        min-height: 292px;
        padding: 22px;
        display: grid;
        place-items: center;
        text-align: center;
        color: white;
        border: 0;
        background:
          radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.2), transparent 24%),
          linear-gradient(145deg, #635be8, #198de9 60%, #28b7ea);
        box-shadow: 0 18px 35px rgba(58, 99, 191, 0.2);
      }

      .flashcard .counter {
        position: absolute;
        top: 14px;
        left: 14px;
        padding: 5px 8px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 10px;
        font-weight: 900;
      }

      .flashcard .favorite {
        position: absolute;
        top: 11px;
        right: 13px;
        font-size: 25px;
      }

      .flashcard .term {
        font-family: Georgia, serif;
        font-size: 31px;
        line-height: 1.3;
        font-weight: 800;
      }

      .flashcard .hint {
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.84);
        font-size: 11px;
        font-weight: 750;
      }

      .flash-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .timer {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 11px;
        background: var(--red-soft);
        color: #c52f41;
        font-size: 12px;
        font-weight: 950;
      }

      .test-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
      }

      .test-grid span {
        height: 33px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #eef3f7;
        color: #5f7085;
        font-size: 11px;
        font-weight: 900;
      }

      .test-grid span.done {
        background: var(--green-soft);
        color: #088054;
      }

      .test-grid span.active {
        background: var(--sky);
        color: white;
      }

      .leader-row {
        display: grid;
        grid-template-columns: 27px 34px 1fr auto;
        align-items: center;
        gap: 8px;
        min-height: 48px;
      }

      .rank {
        color: #697b91;
        font-size: 13px;
        font-weight: 950;
        text-align: center;
      }

      .leader-row.top .rank {
        color: #f1a20b;
        font-size: 18px;
      }

      .note {
        display: grid;
        gap: 7px;
        padding: 12px;
        border-radius: 13px;
        background: #f7fbfe;
        border: 1px solid #e0ebf3;
      }

      .time-pill {
        display: inline-flex;
        width: fit-content;
        padding: 4px 7px;
        border-radius: 8px;
        background: var(--sky-soft);
        color: #0872d6;
        font-size: 10px;
        font-weight: 900;
      }

      .comment-box,
      .text-box {
        width: 100%;
        min-height: 48px;
        border: 1px solid #d4e4ef;
        border-radius: 13px;
        padding: 12px;
        background: white;
        color: #8090a2;
        font-size: 12px;
        font-weight: 650;
      }

      .dashboard-hero {
        position: relative;
        overflow: hidden;
        padding: 16px;
        color: white;
        border: 0;
        background:
          radial-gradient(circle at 88% 24%, rgba(255, 255, 255, 0.24), transparent 24%),
          linear-gradient(135deg, #1378e8, #24a6f2);
      }

      .dashboard-hero::after {
        content: "✦  π  x²";
        position: absolute;
        right: 14px;
        bottom: 10px;
        opacity: 0.3;
        font-family: Georgia, serif;
        font-size: 23px;
      }

      .course-progress {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 12px;
        align-items: center;
      }

      .course-art {
        height: 78px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        color: white;
        background: linear-gradient(145deg, #0b6ee6, #24b4ef);
        font-size: 29px;
        font-weight: 950;
      }

      .personal-banner {
        padding: 12px;
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 10px;
        align-items: center;
        color: #5a45c7;
        background: linear-gradient(135deg, #f4f1ff, #eef7ff);
        border-color: #d9d0ff;
      }

      .personal-icon {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        color: white;
        background: linear-gradient(145deg, #7e65ee, #4f82ef);
        font-size: 20px;
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 11px;
        background: #dfeaf2;
      }

      .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      }

      .sk-title {
        width: 72%;
        height: 21px;
      }

      .sk-line {
        height: 12px;
      }

      .sk-video {
        height: 183px;
        border-radius: 18px;
      }

      .error-state {
        margin-top: 62px;
        padding: 23px 18px;
        text-align: center;
      }

      .error-state .error-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 14px;
        border-radius: 23px;
        display: grid;
        place-items: center;
        color: #b9293a;
        background: var(--red-soft);
        font-size: 34px;
      }

      .divider {
        height: 1px;
        background: #e4edf4;
      }

      .center {
        text-align: center;
      }

      .mt4 {
        margin-top: 4px;
      }

      .mt8 {
        margin-top: 8px;
      }

      .mt10 {
        margin-top: 10px;
      }

      .mt12 {
        margin-top: 12px;
      }

      .mt14 {
        margin-top: 14px;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .action-row.three {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .compact .button {
        min-height: 40px;
        padding: 0 9px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const caseId = new URLSearchParams(location.search).get("case") || "01-lesson-enrolled";
      const logoPath = "logo.png";

      const bottomNav = (active = "study") => {
        const items = [
          ["home", "⌂", "Trang chủ"],
          ["explore", "⌖", "Khám phá"],
          ["study", "🎓", "Học tập"],
          ["events", "▣", "Sự kiện"],
          ["profile", "♙", "Trang cá nhân"],
          ["more", "☰", "Menu"],
        ];
        return `<nav class="bottom-nav">${items
          .map(
            ([id, icon, label]) =>
              `<div class="nav-item ${active === id ? "active" : ""}"><span class="nav-icon">${icon}</span><span>${label}</span></div>`,
          )
          .join("")}</nav>`;
      };

      const shell = ({
        content,
        active = "study",
        back = true,
        actions = true,
        dashboard = false,
      }) => `
        <div class="phone">
          <header class="appbar">
            ${back ? '<button class="back">‹</button>' : ""}
            <div class="brand"><img src="${logoPath}" alt="ClassHero" /></div>
            ${
              actions
                ? '<div class="app-actions"><button class="icon-button">♢</button><button class="icon-button">◉</button></div>'
                : ""
            }
          </header>
          <main class="main">${content}</main>
          ${bottomNav(dashboard ? "home" : active)}
        </div>`;

      const lessonHeading = (badge = "", title = "Bài 5. Tỉ lệ thức") => `
        <div class="lesson-heading">
          <div class="breadcrumb"><span>Toán 7</span><b>›</b><span>Chương 1. Số hữu tỉ</span><b>›</b></div>
          <div class="row between">
            <h1 class="grow">${title}</h1>
            ${badge}
          </div>
        </div>`;

      const lessonVideo = (time = "12:24 / 38:00") => `
        <div class="video">
          <span class="play">▶</span>
          <span class="video-time">${time}</span>
        </div>`;

      const lessonOverview = ({ trial = false } = {}) =>
