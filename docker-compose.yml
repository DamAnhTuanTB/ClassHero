services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learning-path-postgres
    environment:
      POSTGRES_DB: learning_path_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_path_dev"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learning-path-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: learning-path-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: learning-path-api
    command: pnpm --filter @learning-path/api dev
    env_file:
      - .env.example
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/learning_path_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/learning_path_dev?schema=public
      REDIS_URL: redis://redis:6379
      FILE_STORAGE_PROVIDER: minio_local
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: learning-path-dev
      S3_FORCE_PATH_STYLE: "true"
      FILE_PUBLIC_BASE_URL:
      FILE_SIGNED_URL_TTL_SECONDS: 900
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: learning-path-worker
    command: pnpm --filter @learning-path/api worker:dev
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/learning_path_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/learning_path_dev?schema=public
      REDIS_URL: redis://redis:6379
      FILE_STORAGE_PROVIDER: minio_local
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: learning-path-dev
      S3_FORCE_PATH_STYLE: "true"
      FILE_PUBLIC_BASE_URL:
      FILE_SIGNED_URL_TTL_SECONDS: 900
      TEX_RENDERER_URL: http://tex-renderer:8080
      TEX_RENDERER_TOKEN: local-tex-renderer-token
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      tex-renderer:
        condition: service_healthy
    networks:
      - default
      - tex_internal

  tex-renderer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.tex-renderer
    container_name: learning-path-tex-renderer
    environment:
      TEX_RENDERER_PORT: 8080
      TEX_RENDERER_TOKEN: local-tex-renderer-token
      TEX_RENDER_TIMEOUT_MS: 20000
      TEX_RENDER_MAX_SOURCE_BYTES: 40000
      TEX_RENDER_MAX_SVG_BYTES: 2000000
      TEX_RENDERER_VERSION: texlive-debian-v3-snippet
    expose:
      - "8080"
    ports:
      # Host-only access keeps the renderer private while allowing the local
      # `pnpm dev` worker to use the same isolated service as Docker workers.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
      - tex_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: learning-path-web
    command: pnpm --filter @learning-path/web dev
    env_file:
      - apps/web/.env.example
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:

networks:
  tex_internal:
    internal: true
